name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --legacy-peer-deps

      - name: Lint, format, and type check
        run: npx vp check

      - name: Svelte type check
        run: npx svelte-kit sync && npx svelte-check --tsgo --threshold error

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --legacy-peer-deps

      - name: Unit tests with coverage
        run: npm run test:coverage -- --maxWorkers=100%

      - name: Package smoke test
        run: npm run test:package

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --legacy-peer-deps

      - name: Install Playwright
        run: npx playwright install chromium --only-shell

      - name: E2E tests
        run: npx playwright test --workers=4

  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v7

      - name: Discover broken links
        uses: lycheeverse/lychee-action@v2
        with:
          # Deployed docs and unreleased compare tags are unavailable until after merge.
          # The prerender crawl validates internal docs links.
          # Source links follow main in published docs; validate them against the revision under review.
          args: --remap '^https://github\.com/janosh/svelte-widgets/(blob|tree)/main/(.*) https://github.com/janosh/svelte-widgets/$1/${{ github.event.pull_request.head.sha || github.sha }}/$2' --exclude '%7B' --exclude '^file://' --exclude '^https://svelte-widgets\.janosh\.dev' --exclude '^https://github\.com/janosh/svelte-widgets/compare/' --root-dir . --accept 100..=103,200..=299,403,429,502,503 -- ./**/*.{md,svelte,ts}

  build:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      - run: npm install --legacy-peer-deps
      - run: npm run build:site
        env:
          BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, check, unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  # Consumers track main through this tarball instead of a git dependency, which would
  # clone and build the repo on every install. The prerelease's tag never moves; its
  # notes and the tarball's gitHead name the commit it was built from.
  main-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, unit, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package.json

      # npm install runs prepare, which builds dist/
      - run: npm install --legacy-peer-deps

      # Upload under a temporary name, then swap it in: --clobber on the final name deletes
      # the old tarball before the new one finishes uploading, failing installs in between.
      # The old one is renamed aside, not deleted, until the new one has taken its name.
      - name: Upload main build to the main-build prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          npm pkg set gitHead="$GITHUB_SHA"
          mv "$(npm pack --ignore-scripts)" svelte-widgets-next.tgz
          gh release upload main-build svelte-widgets-next.tgz --clobber
          api="repos/$GITHUB_REPOSITORY/releases"
          asset_id() { gh api "$api/tags/main-build" --jq ".assets[] | select(.name == \"$1\") | .id"; }
          prev_id=$(asset_id svelte-widgets-prev.tgz) # left by a cancelled or failed swap
          if [ -n "$prev_id" ]; then gh api -X DELETE "$api/assets/$prev_id"; fi
          old_id=$(asset_id svelte-widgets.tgz)
          new_id=$(asset_id svelte-widgets-next.tgz)
          rename() { gh api -X PATCH "$api/assets/$1" -f name="$2" > /dev/null; }
          if [ -n "$old_id" ]; then rename "$old_id" svelte-widgets-prev.tgz; fi
          if ! rename "$new_id" svelte-widgets.tgz; then
            if [ -n "$old_id" ]; then rename "$old_id" svelte-widgets.tgz; fi
            exit 1
          fi
          if [ -n "$old_id" ]; then gh api -X DELETE "$api/assets/$old_id"; fi
          gh release edit main-build --notes "Build of main@$GITHUB_SHA"
