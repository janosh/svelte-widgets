<!doctype html>
<html lang="en">
  <head>
    <meta name="author" content="Janosh Riebesell" />

    <meta name="og:card" content="summary" />
    <meta name="twitter:site" content="@jrib_" />
    <meta name="twitter:creator" content="@jrib_" />
    <meta
      name="description"
      content="Keyboard-friendly, accessible and highly customizable Svelte components"
    />

    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <!-- FOUC mirror of apply_theme_mode: light/dark as-is; anything else via matchMedia. -->
    <script>
      {
        let effective_theme
        try {
          effective_theme = localStorage.getItem(`theme`)
        } catch {}
        if (effective_theme !== `light` && effective_theme !== `dark`)
          effective_theme = globalThis.matchMedia?.(`(prefers-color-scheme: dark)`)
            .matches
            ? `dark`
            : `light`
        document.documentElement.style.colorScheme = effective_theme
        document.documentElement.dataset.theme = effective_theme
      }
    </script>

    <meta property="og:type" content="article" />
    <!-- absolute URL since social scrapers can't resolve site-relative paths or data URIs -->
    <meta
      property="og:image"
      content="https://raw.githubusercontent.com/janosh/svelte-widgets/HEAD/src/site/favicon.svg"
    />
    <meta property="og:url" content="https://svelte-widgets.janosh.dev" />
    <meta property="twitter:site_name" content="Svelte Widgets" />

    <script
      defer
      data-domain="svelte-widgets.janosh.dev"
      src="https://plausible.io/js/plausible.js"
    ></script>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
